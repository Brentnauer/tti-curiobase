en:
  # ⚠ NAMES THE ADMIN PAGE AND THE SETTINGS SECTION. `Plugin::Instance#
  #   humanized_name` prefers the setting category's label over the plugin
  #   directory name, which is what stopped the page reading "Tti curiobase".
  #   Ships with the `curiobase:` top-level key in config/settings.yml — either
  #   one alone leaves a translation-missing string in the heading.
  admin_js:
    admin:
      site_settings:
        categories:
          curiobase: "Curiobase"
  js:
    curiobase:
      gravity_heading: "How strongly does this pull on the idea?"
      unrated: "No rating yet"
      rate_prompt: "Your take"
      # ⚠ Says what the click will DO, not what the mark means. On your own vote
      #   that is the opposite of every other mark in the row.
      retract: "Click again to take your vote back"
      sign_in_to_rate: "Sign in to rate"
      trust_level_to_rate: "Rating opens up as you read more"
      # Labels the DISTRIBUTION BAR (headcount). The number beside it is the
      # plain mean of eligible votes — one member, one vote.
      members_rated:
        one: "1 vote"
        other: "%{count} votes"
      members_disagree: "members disagree"
      status_membership_split: "Marked %{status}, but members still disagree on how some works pull on this."
      # The anchors are the whole point of the scale. A star with no stated
      # meaning is a popularity contest; "4 — load-bearing" is a claim someone
      # can actually disagree with.
      #
      # ⚠ Must stay in step with config/locales/server.en.yml. The server bakes
      #   the anchors line into cooked and the client labels the buttons from
      #   here; if the two drift, the tooltip contradicts the legend directly
      #   above it. Same keys, same words, both files.
      anchors:
        fiction:
          mentions: "a mention"
          dressing: "set dressing"
          serious: "plays fair"
          builds: "load-bearing"
          essential: "made of it"
        nonfiction:
          mentions: "a mention"
          touches: "secondhand"
          covers: "a briefing"
          focuses: "an investigation"
          entirely: "part of the record"
        neutral:
          mentions: "a mention"
          passing: "peripheral"
          engages: "in its orbit"
          central: "bound to it"
          defining: "inseparable"

      composer:
        build: "Curiobase record…"
        build_short: "Curiobase"
        stub_subject: "Subject stub"
        stub_work: "Work stub"
        title: "Curiobase record"
        loading: "Loading field lists…"
        schema_failed: "Could not load Curiobase field lists."
        insert_failed: "Could not build the fence."
        insert: "Insert fence"
        type: "Type"
        slug: "Slug"
        kind: "Kind"
        domain: "Domain"
        status: "Status"
        medium: "Medium"
        mode: "Mode"
        year: "Year"
        creator: "Creator"
        dek: "Dek"
        dek_over: "over limit"
        period: "Period"
        evidence: "Evidence"
        list_hint: "Comma-separated allowlist values"
        edges: "Subject edges"
        edges_hint: "Targets without a Subject file stay pending until that file exists."
        edge_slug: "target-slug"
        add_edge: "Add edge"
        remove_edge: "Remove edge"
        body_hint: "Topic title is the record title. Poster/plate is an image dragged into the composer. Prose goes in the post body below the fence."
