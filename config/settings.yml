# ⚠ THE TOP-LEVEL KEY IS THE SETTING CATEGORY, AND IT NAMES THE ADMIN PAGE.
#
#   `Plugin::Instance#humanized_name` is `(setting_category_name || name)`, so
#   with this under `plugins:` the page title fell back to the directory name
#   and rendered as **"Tti curiobase"**. Naming the category gives it a real
#   title and its own section in /admin/site_settings, which is what core
#   plugins do. Settings are stored by name, so this moves nothing.
#
#   The label comes from `admin_js.admin.site_settings.categories.curiobase` in
#   config/locales/client.en.yml — without that key the title is the raw
#   translation-missing string, so the two must ship together.
curiobase:
  curiobase_enabled:
    default: false
    client: true

  # Minimum trust level to cast a gravity rating.
  curiobase_min_trust_level:
    default: 1
    client: true

  # ⚠ Gravity IS the vote — there is no other source for the number. Turning
  #   this off removes the number entirely (no editorial fallback).
  curiobase_member_voting_enabled:
    default: true
    client: true

  # ── structured data (optional SEO export) ───────────────────────────────
  #
  # ⚠ OFF BY DEFAULT. Catalogue truth is pairings + votes; AggregateRating is
  #   a search experiment. Google may show it as review stars even though
  #   gravity is centrality. Entity markup (Movie/Book/sameAs/about) emits
  #   either way.
  #
  # When on: one AggregateRating per Work URL from the primary pairing (most
  # voters), only if that pairing meets the min-voter floor.
  curiobase_structured_ratings:
    default: false
    client: false

  curiobase_structured_ratings_min_voters:
    default: 5
    min: 1
    max: 100
    client: false

  # ── buy links ────────────────────────────────────────────────────────────
  #
  # ⚠ OFF by default, and each vendor needs its own id before it renders. A
  #   buy button with no affiliate tag is a link that earns nothing and still
  #   costs the reader's trust.
  curiobase_buy_links_enabled:
    default: false
    client: false

  # Amazon Associates tag, e.g. "tti-20". Blank hides the Amazon button.
  #
  # ⚠ ONE TAG COVERS AMAZON AND ABEBOOKS. AbeBooks is an Amazon company and runs
  #   on the same Associates account, which matters here because out of print is
  #   the normal state of this catalogue.
  curiobase_amazon_tag:
    default: ""
    client: false

  # GOG affiliate tracking prefix. Blank hides the GOG button.
  #
  # ⚠ THIS IS A WHOLE URL PREFIX, NOT AN ID. GOG runs affiliates through
  #   Adtraction, whose links wrap the destination in a redirect carrying both a
  #   programme id and an affiliate id. Paste the prefix your affiliate
  #   dashboard gives you, up to and including the parameter the destination URL
  #   goes in — the GOG search URL is appended, URL-encoded.
  #
  #   A guessed tracking URL is the worst possible failure here: it looks like
  #   it works and credits nobody. Better that this is fiddly once.
  curiobase_gog_tracking_prefix:
    default: ""
    client: false

  # eBay Partner Network campaign id. Blank hides the eBay button.
  #
  # ⚠ eBay links are SEARCHES, never listings. A listing id is a dead link
  #   within weeks and a permanent chore; a search for the title never expires.
  curiobase_ebay_campaign:
    default: ""
    client: false
